<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Generador de Videos</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
      h1 { margin-bottom: 8px; }
      p { color: #444; }
      label { display: block; margin-top: 14px; font-weight: 600; }
      input, textarea, button { width: 100%; padding: 10px; margin-top: 6px; }
      button { cursor: pointer; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .card { border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-top: 18px; }
      .muted { font-size: 12px; color: #666; }
      pre { background: #f7f7f7; border: 1px solid #eee; border-radius: 8px; padding: 10px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>Dashboard</h1>
    <p>Este frontend <strong>no expone claves</strong>. Solo llama a tu backend.</p>
    <p class="muted">Configura <code>config.js</code> con tu dominio backend.</p>

    <div class="card">
      <h2>Generar video</h2>
      <label for="prompt">Prompt</label>
      <textarea id="prompt" rows="4" placeholder="Describe el video..."></textarea>
      <button id="btnVideo">Generar video</button>
      <pre id="videoOut">Sin resultados todavía.</pre>
    </div>

    <div class="card">
      <h2>Text-to-Speech</h2>
      <label for="text">Texto</label>
      <textarea id="text" rows="3" placeholder="Texto a convertir en voz..."></textarea>
      <div class="row">
        <div>
          <label for="voiceId">Voice ID (opcional)</label>
          <input id="voiceId" placeholder="p.ej. 21m00Tcm4TlvDq8ikWAM" />
        </div>
        <div>
          <label for="format">Formato (opcional)</label>
          <input id="format" placeholder="mp3_44100_128" />
        </div>
      </div>
      <button id="btnTTS">Generar audio</button>
      <pre id="ttsOut">Sin resultados todavía.</pre>
    </div>

    <script src="./config.js"></script>
    <script>
      const API_BASE_URL = (window.APP_CONFIG && window.APP_CONFIG.API_BASE_URL) || "";

      async function postJson(path, payload) {
        if (!API_BASE_URL || API_BASE_URL.includes('TU-BACKEND.com')) {
          throw new Error('Configura API_BASE_URL en config.js con tu backend real.');
        }
        const res = await fetch(`${API_BASE_URL}${path}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const contentType = res.headers.get('content-type') || '';
        const data = contentType.includes('application/json') ? await res.json() : await res.text();

        if (!res.ok) {
          const message = typeof data === 'string' ? data : (data.error || JSON.stringify(data));
          throw new Error(`HTTP ${res.status}: ${message}`);
        }

        return data;
      }

      document.getElementById('btnVideo').addEventListener('click', async () => {
        const out = document.getElementById('videoOut');
        const prompt = document.getElementById('prompt').value.trim();
        out.textContent = 'Generando...';
        try {
          const result = await postJson('/api/generate-video', { prompt });
          out.textContent = JSON.stringify(result, null, 2);
        } catch (err) {
          out.textContent = `Error: ${err.message}`;
        }
      });

      document.getElementById('btnTTS').addEventListener('click', async () => {
        const out = document.getElementById('ttsOut');
        const text = document.getElementById('text').value.trim();
        const voiceId = document.getElementById('voiceId').value.trim();
        const format = document.getElementById('format').value.trim();
        out.textContent = 'Generando...';
        try {
          const result = await postJson('/api/tts', {
            text,
            ...(voiceId ? { voiceId } : {}),
            ...(format ? { format } : {})
          });
          out.textContent = JSON.stringify(result, null, 2);
        } catch (err) {
          out.textContent = `Error: ${err.message}`;
        }
      });
    </script>
  </body>
</html>
